<!DOCTYPE html>
<html lang='en'>
	<head>
		<meta charset='UTF-8'>
		<meta name=viewport content='width=device-width, initial-scale=1.0'>
		<title>Typeshift solver</title>
		<style>
			img, picture, video, canvas, svg {
				display: block;
				max-width: 100%;
			}

			main {
				display: flex;
				flex-direction: row;
				flex-grow: 0;
				gap: 1rem;
			}

			div.column {
				display: flex;
				flex-direction: column;
				gap: 1rem;
			}

			textarea {
				font-size: 2rem;
				resize: none;
				padding: 0.5rem;
			}

			button#addColumn {
				height: 100%;
			}

			.rotated-text {
				transform: rotate(-90deg);
				display: inline-block;
			}
		</style>
	</head>
	<body>
		<h1>Typeshift solver</h1>
		<main>
			<div class="column">
				<textarea cols="1" rows="1" maxlength="1" autofocus></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
			</div>
			<div class="column">
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
			</div>
			<div class="column">
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
			</div>
			<div class="column">
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
			</div>
			<div class="column">
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
			</div>
			<div class="column">
				<button id="addColumn">
					<span class="rotated-text">add column</span>
				</button>
			</div>
		</main>
