<!DOCTYPE html>
<html lang='en'>
	<head>
		<meta charset='UTF-8'>
		<meta name=viewport content='width=device-width, initial-scale=1.0'>
		<title>Typeshift solver</title>
		<style>
			img, picture, video, canvas, svg {
				display: block;
				max-width: 100%;
			}

			textarea {
				resize: none;
				font-size: 2.5em;
				max-width: 1em;
				text-align: center;
			}

			#grid {
				display: grid;
				grid-auto-flow: column;
				grid-template-rows: repeat(5, 1fr);
				grid-template-columns: repeat(5, 1fr);
				
			}
		</style>
	</head>
	<body>
		<h1>Typeshift solver</h1>
		<main>
			<div id="grid">
				<textarea cols="1" rows="1" maxlength="1" autofocus></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
				<textarea cols="1" rows="1" maxlength="1"></textarea>
			</div>
		</main>
		<script src=main.js></script>
	</body>
</html>
