<!DOCTYPE html>
<html lang='en'>
	<head>
		<meta charset='UTF-8'>
		<meta name=viewport content='width=device-width, initial-scale=1.0'>
		<title>Typeshift solver</title>
		<style>
			body {
				font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
				padding: 0 1em;
			}

			img, picture, video, canvas, svg {
				display: block;
				max-width: 100%;
			}

			textarea {
				resize: none;
				font-size: 2.5em;
				max-width: 1em;
				text-align: center;
			}

			#grid {
				margin: 2em 0em;
				display: flex;
				flex-direction: row;
				gap: 1.5em;
			}

			.column {
				display: flex;
				flex-direction: column;
				gap: 0.75em;
			}
		</style>
	</head>
	<body>
		<h1>Typeshift solver</h1>
		<main>
			<div id="grid">
				<div class="column">
					<textarea cols="1" rows="1" maxlength="1" autofocus></textarea>
					<textarea cols="1" rows="1" maxlength="1"></textarea>
					<textarea cols="1" rows="1" maxlength="1"></textarea>
					<textarea cols="1" rows="1" maxlength="1"></textarea>
					<textarea cols="1" rows="1" maxlength="1"></textarea>
				</div>
				<div class="column">
					<textarea cols="1" rows="1" maxlength="1"></textarea>
					<textarea cols="1" rows="1" maxlength="1"></textarea>
					<textarea cols="1" rows="1" maxlength="1"></textarea>
					<textarea cols="1" rows="1" maxlength="1"></textarea>
					<textarea cols="1" rows="1" maxlength="1"></textarea>
				</div>
				<div class="column">
					<textarea cols="1" rows="1" maxlength="1"></textarea>
					<textarea cols="1" rows="1" maxlength="1"></textarea>
					<textarea cols="1" rows="1" maxlength="1"></textarea>
					<textarea cols="1" rows="1" maxlength="1"></textarea>
					<textarea cols="1" rows="1" maxlength="1"></textarea>
				</div>
				<div class="column">
					<textarea cols="1" rows="1" maxlength="1"></textarea>
					<textarea cols="1" rows="1" maxlength="1"></textarea>
					<textarea cols="1" rows="1" maxlength="1"></textarea>
					<textarea cols="1" rows="1" maxlength="1"></textarea>
					<textarea cols="1" rows="1" maxlength="1"></textarea>
				</div>
				<div class="column">
					<textarea cols="1" rows="1" maxlength="1"></textarea>
					<textarea cols="1" rows="1" maxlength="1"></textarea>
					<textarea cols="1" rows="1" maxlength="1"></textarea>
					<textarea cols="1" rows="1" maxlength="1"></textarea>
					<textarea cols="1" rows="1" maxlength="1"></textarea>
				</div>
			</div>
			<!-- <button onclick="solve()">Solve</button> -->
			 <button>Solve</button>
		</main>
		<script src="main.js"></script>
		<script src="solve.js"></script>
	</body>
</html>
